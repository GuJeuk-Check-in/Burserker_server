# ops/gujeuk/docker-compose.aws.yml과 합쳐 환경당 하나의 Compose 프로젝트로 실행합니다.
services:
  beopdong-app:
    image: ${BEOPDONG_APP_IMAGE:?BEOPDONG_APP_IMAGE is required}
    container_name: ${BEOPDONG_APP_CONTAINER_NAME:?BEOPDONG_APP_CONTAINER_NAME is required}
    restart: unless-stopped
    mem_limit: 512m
    labels:
      com.datadoghq.tags.service: "beopdong-api"
      com.datadoghq.tags.env: "${DD_ENV:?DD_ENV is required}"
    environment:
      DB_URL: ${BEOPDONG_DB_URL:?BEOPDONG_DB_URL is required}
      MYSQL_USER: ${BEOPDONG_MYSQL_USER:?BEOPDONG_MYSQL_USER is required}
      MYSQL_PASSWORD: ${BEOPDONG_MYSQL_PASSWORD:?BEOPDONG_MYSQL_PASSWORD is required}
      JWT_SECRET_KEY: ${BEOPDONG_JWT_SECRET_KEY:?BEOPDONG_JWT_SECRET_KEY is required}
      JAVA_OPTS: ${BEOPDONG_JAVA_OPTS:--Xms64m -Xmx256m}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "1"
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: warn
      LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_BIND: warn
    ports:
      - "${BEOPDONG_APP_PORT:?BEOPDONG_APP_PORT is required}:8080"
    depends_on:
      beopdong-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  beopdong-mysql:
    image: mysql:8.0
    container_name: ${BEOPDONG_MYSQL_CONTAINER_NAME:?BEOPDONG_MYSQL_CONTAINER_NAME is required}
    restart: unless-stopped
    mem_limit: 768m
    labels:
      com.datadoghq.tags.service: "mysql"
      com.datadoghq.tags.env: "${DD_ENV:?DD_ENV is required}"
    environment:
      MYSQL_DATABASE: ${BEOPDONG_MYSQL_DATABASE:?BEOPDONG_MYSQL_DATABASE is required}
      MYSQL_USER: ${BEOPDONG_MYSQL_USER:?BEOPDONG_MYSQL_USER is required}
      MYSQL_PASSWORD: ${BEOPDONG_MYSQL_PASSWORD:?BEOPDONG_MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${BEOPDONG_MYSQL_ROOT_PASSWORD:?BEOPDONG_MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --performance-schema=OFF
    volumes:
      - beopdong_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  beopdong_mysql_data:
    name: ${BEOPDONG_MYSQL_VOLUME_NAME:?BEOPDONG_MYSQL_VOLUME_NAME is required}
