spring:
  application:
    name: beopdong-api
  datasource:
    url: ${DB_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
      connect-timeout: 2s
      timeout: 2s
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      # 스키마 변경은 법동 전용 Flyway 마이그레이션으로 관리합니다.
      ddl-auto: none

server:
  # IDE 로컬 실행은 env에서 8082, 컨테이너 기본 실행은 8080을 사용합니다.
  port: ${SERVER_PORT:8080}

jwt:
  header: Authorization
  prefix: Bearer
  accessExpiration: 7200
  refreshExpiration: 604800
  secretKey: ${JWT_SECRET_KEY}

neis:
  api-key: ${NEIS_API_KEY}
