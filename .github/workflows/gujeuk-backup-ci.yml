name: Gujeuk Backup Verification

on:
  pull_request:
    paths:
      - "ops/gujeuk/backup/**"
      - ".github/workflows/gujeuk-backup-ci.yml"
  push:
    branches: ["develop", "main"]
    paths:
      - "ops/gujeuk/backup/**"
      - ".github/workflows/gujeuk-backup-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: ops/gujeuk/backup
        run: python3 -m unittest -v test_backup.py
      - name: Validate scripts and timer calendars
        run: |
          bash -n ops/gujeuk/backup/install.sh
          systemd-analyze calendar '*-*-* 00:00:00 Asia/Seoul'
          systemd-analyze calendar '*-*-* 01..19:00:00 Asia/Seoul'
          systemd-analyze calendar '*-*-* 19:30:00 Asia/Seoul'
          systemd-analyze calendar '*-*-* *:00/5:00 Asia/Seoul'
      - name: Restore hourly and final dumps in disposable MySQL
        working-directory: ops/gujeuk/backup
        run: python3 test_restore.py
